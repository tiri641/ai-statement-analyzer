name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: local_dev_password
          POSTGRES_DB: statement_analyzer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d statement_analyzer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          DATABASE_URL: postgres://app:local_dev_password@127.0.0.1:5432/statement_analyzer_test
      - run: npm run typecheck
      - run: npm run typecheck:infra
      - run: npm run build
      - run: npm run cdk:synth
